services:
  db:
    image: mariadb:10.11
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: martin
      MYSQL_USER: martin
      MYSQL_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  api:
    build:
      context: ./api-laravel
      dockerfile: Dockerfile
    container_name: laravel_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    # Las env en runtime sobreescriben las del Dockerfile
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: martin
      DB_USERNAME: martin
      DB_PASSWORD: root
    deploy:
      resources:
        limits:
          memory: 512m

  front:
    build:
      context: ./front-preact
      dockerfile: Dockerfile
    container_name: preact_front
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - api
    volumes:
      - ./front-preact:/app
      - node_modules_cache:/app/node_modules # volumen nombrado, no anónimo
    deploy:
      resources:
        limits:
          memory: 512m

volumes:
  db_data:
  node_modules_cache: # nombrado para que Docker lo reutilice entre reinicios
